<h2>Members Bills</h2>

<table border="1">
    <h3>{{ members.name }} ({{ members.flat_number }})</h3>
<tr>
    
    <th>Month</th>
    <th>Year</th>
    <th>Total</th>
    <th>Balance</th>
</tr>

{% for bill in bills %}
<tr>
    
    <td>{{ bill.month }}</td>
    <td>{{ bill.year }}</td>
    <td>{{ bill.total_amount }}</td>
    <td>{{ bill.balance_amount }}</td>
</tr>
{% endfor %}
</table>

<a href="/dashboard">Back</a>
