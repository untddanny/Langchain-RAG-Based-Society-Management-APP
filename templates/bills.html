<h2>Members Bills</h2>

<table border="1">
<tr>
    <th>Name</th>
    <th>Flat</th>
    <th>Total</th>
    <th>Balance</th>
</tr>

{% for member in members %}
<tr>
    <td>{{ member.name }}</td>
    <td>{{ member.flat_number }}</td>
    <td>{{ member.bills[0].total_amount }}</td>
    <td>{{ member.bills[0].balance_amount }}</td>
</tr>
{% endfor %}
</table>

<a href="/dashboard">Back</a>
