<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f5f5;">

<div class="container mt-5">

    <h2>Welcome {{ user }}</h2>

    <a href="/logout" class="btn btn-danger float-end">Logout</a>

    <hr>

    {% if user == "member" %}
        <h4>Member Dashboard</h4>

        <a href="/pay-bills" class="btn btn-primary m-2">Pay Bills</a>
        <a href="/complaints" class="btn btn-warning m-2">Raise Complaint</a>
        <a href="/chatbot" class="btn btn-success m-2">AI Chatbot</a>

    {% else %}
        <h4>Admin Dashboard</h4>

        <a href="/admin-complaints" class="btn btn-warning m-2">View Complaints</a>
        <a href="/admin-docs" class="btn btn-info m-2">Manage Documents</a>
    {% endif %}

</div>

</body>
</html>
