<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f5f5f5;">

<div class="container mt-4">

    <!-- Top Bar -->
    <div class="d-flex justify-content-between align-items-center">
        <h2>Welcome {{ user }}</h2>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>

    <hr>

    {% if user == "member" %}
        <h4>Member Dashboard</h4>

        <div class="mt-3">
            <a href="/bills" class="btn btn-primary m-2">Pay Bills</a>
            <a href="/complaints" class="btn btn-warning m-2">Raise Complaint</a>
            <a href="/chatbot" class="btn btn-success m-2">AI Chatbot</a>
        </div>

    {% else %}
        <h4>Admin Dashboard</h4>

        <div class="mt-3">
            <a href="/admin-complaints" class="btn btn-warning m-2">View Complaints</a>
            <a href="/admin-docs" class="btn btn-info m-2">Manage Documents</a>
            <a href="/add-member" class="btn btn-success m-2">Add Member</a>
            <a href="/generate-bill" class="btn btn-primary m-2">Generate Bill</a>
        </div>
    {% endif %}

</div>

</body>
</html>
