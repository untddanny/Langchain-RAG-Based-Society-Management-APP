

{% block content %}
<div class="container">
    <h2>💬 Society Rules Chatbot</h2>
    
    <div id="chat-box" style="border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: auto; margin-bottom: 10px;">
        <!-- Messages will appear here -->
    </div>
    
    <form id="chat-form" style="display: flex; gap: 10px;">
        <input type="text" id="question" placeholder="Ask about society rules..." required style="flex: 1;">
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
</div>

<script>
document.getElementById('chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const question = document.getElementById('question').value;
    const chatBox = document.getElementById('chat-box');
    
    // Show user question
    chatBox.innerHTML += `<p><b>You:</b> ${question}</p>`;
    document.getElementById('question').value = '';
    
    // Get answer from backend
    const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: question})
    });
    
    const data = await response.json();
    
    // Show bot answer
    chatBox.innerHTML += `<p><b>Bot:</b> ${data.answer}</p>`;
    chatBox.scrollTop = chatBox.scrollHeight;
});
</script>
{% endblock %}
